<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c28f"/>
      <stop offset="0.55" stop-color="#0b8f6b"/>
      <stop offset="1" stop-color="#065e47"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f4ee"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#03392b" flood-opacity=".35"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  </g>
  <!-- notebook page -->
  <g filter="url(#sh)">
    <rect x="270" y="235" width="484" height="560" rx="56" fill="url(#paper)"/>
  </g>
  <!-- binder rings -->
  <g fill="#0b8f6b">
    <rect x="352" y="205" width="34" height="78" rx="17"/>
    <rect x="495" y="205" width="34" height="78" rx="17"/>
    <rect x="638" y="205" width="34" height="78" rx="17"/>
  </g>
  <!-- rows: check + line (drawn right-to-left like Persian text) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="668" cy="378" r="30" fill="#0b8f6b" stroke="none"/>
    <path d="M654 378 l10 11 l19 -22" stroke="#fff" stroke-width="10"/>
    <line x1="608" y1="378" x2="350" y2="378" stroke="#9fd6c2" stroke-width="26"/>
    <circle cx="668" cy="480" r="30" fill="#0b8f6b" stroke="none"/>
    <path d="M654 480 l10 11 l19 -22" stroke="#fff" stroke-width="10"/>
    <line x1="608" y1="480" x2="410" y2="480" stroke="#9fd6c2" stroke-width="26"/>
    <circle cx="668" cy="582" r="27" stroke="#0b8f6b" stroke-width="9"/>
    <line x1="608" y1="582" x2="470" y2="582" stroke="#cfe8de" stroke-width="26"/>
  </g>
  <!-- microphone badge -->
  <g filter="url(#sh)">
    <circle cx="378" cy="690" r="112" fill="#f6b94a"/>
  </g>
  <g fill="#fff">
    <rect x="352" y="622" width="52" height="92" rx="26"/>
  </g>
  <path d="M322 688 a56 56 0 0 0 112 0" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <line x1="378" y1="744" x2="378" y2="770" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
</svg>
